<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root { color-scheme: dark; --bg: #0a0e1a; --edge: rgba(255, 255, 255, .14); --text: #f5f5f7; --muted: rgba(235, 235, 245, .62); --s1: #3987e5; --critical: #ff5f57; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: radial-gradient(50vw 50vw at 25% 20%, rgba(64, 110, 255, .38), transparent 70%), radial-gradient(45vw 45vw at 80% 35%, rgba(150, 70, 235, .3), transparent 70%), radial-gradient(55vw 55vw at 60% 100%, rgba(0, 170, 190, .26), transparent 70%), var(--bg); }
form { width: 100%; max-width: 320px; background: rgba(255, 255, 255, .065); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 10px 30px rgba(0, 0, 0, .22); border-radius: 20px; padding: 22px; display: grid; gap: 10px; }
h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
label { color: var(--muted); font-size: 12px; }
input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--edge); border-radius: 12px; }
button { padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--s1); border: 0; border-radius: 12px; cursor: pointer; }
#error { color: var(--critical); min-height: 20px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>{{TITLE}}</h1>
  <label for="user">User</label>
  <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div id="error" role="alert"></div>
  <button type="submit">Sign in</button>
</form>
<script>
const e = new URLSearchParams(location.search).get('e');
document.getElementById('error').textContent = e === 'locked' ? 'Too many attempts. Try again in a few minutes.' : e ? 'Wrong user or password' : '';
</script>
</body>
</html>
