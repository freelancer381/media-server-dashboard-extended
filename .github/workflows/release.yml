# Release: runs when a tag v* is pushed (scripts/release.sh prepares it).
#
#   test     the whole CI (ci.yml) on the tagged commit
#   release  build the archive and release.json, sign release.json keyless with this workflow's
#            identity (Sigstore), verify the signature; build the container image for amd64 and
#            arm64, push it to GHCR and sign it the same way; then publish the GitHub release
#            (nothing is public before everything above passed)
#
# Every installation's update service trusts exactly this file at the release tag
# (updater/msd-updater.py: certificate identity .github/workflows/release.yml@refs/tags/vX.Y.Z),
# so keep its name and keep the signing in this file.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign and publish
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release
      packages: write # the container image on GHCR
      id-token: write # keyless signing with this workflow's OIDC identity
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: v
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          [ "$(cat VERSION)" = "$V" ] || { echo "::error::VERSION ($(cat VERSION)) does not match the tag $GITHUB_REF_NAME"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build the archive and release.json
        run: python3 scripts/build-release.py --version "${{ steps.v.outputs.version }}" --ref "$GITHUB_REF_NAME" --out dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # the same version scripts/install-in-container.sh puts on the servers

      - name: Sign and verify release.json
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/release.json.sigstore.json dist/release.json
          # The same check every installation makes before it installs this release.
          cosign verify-blob --bundle dist/release.json.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-trigger push \
            dist/release.json

      - name: QEMU (arm64 images)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$V"
            echo "$IMAGE:${V%.*}"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}

      - name: Smoke-test the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8900:8900 "$IMAGE@$DIGEST"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8900/healthz | grep -q '"version": "${{ steps.v.outputs.version }}"'; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke
          [ "${ok:-}" = 1 ] || { echo "::error::the image did not come up with the right version"; exit 1; }
          docker rm -f smoke

      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          {
            cat dist/notes.md
            printf '\n---\n\n**Container:** `%s:%s` (`docker compose pull && docker compose up -d`)\n' "$IMAGE" "$V"
            printf '\n**LXC:** Settings → Updates installs this release after checking its signature.\n'
          } > dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Media Server Dashboard $V" --notes-file dist/release-notes.md \
            "dist/media-server-dashboard-$V.tar.gz" dist/release.json dist/release.json.sigstore.json
